name: cf-upload-relay
on:
  workflow_dispatch:
    inputs:
      jwt:
        description: "Cloudflare asset-upload session JWT"
        required: true
      hash:
        description: "asset hash (32 hex chars)"
        required: true
      b64:
        description: "base64-encoded _worker.js"
        required: true
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - name: Mask JWT in logs
        run: echo "::add-mask::${{ inputs.jwt }}"
      - name: Probe and upload
        run: |
          probe=$(curl -sS -m 30 -o /dev/null -w "%{http_code}" https://api.workers.cloudflare.com/ || echo CURLFAIL)
          echo "probe_root=$probe"
          printf '%s' '${{ inputs.b64 }}' > worker.b64
          code=$(curl -sS -m 60 -o resp.txt -w "%{http_code}" -X POST "https://api.workers.cloudflare.com/client/v4/accounts/295e1e898cc5401d7e569d91cd1ddbbb/workers/assets/upload?base64=true" -H "Authorization: Bearer ${{ inputs.jwt }}" -F "${{ inputs.hash }}=@worker.b64;type=application/javascript;filename=${{ inputs.hash }}" || echo CURLFAIL)
          echo "upload_http_code=$code"
          respb64=$(base64 -w0 resp.txt 2>/dev/null || echo "")
          printf '{\n  "probe_root": "%s",\n  "upload_http_code": "%s",\n  "response_b64": "%s"\n}\n' "$probe" "$code" "$respb64" > result.json
          cat result.json
      - name: Commit result
        if: always()
        run: |
          git config user.email "relay@local"
          git config user.name "cf-relay"
          git add result.json 2>/dev/null || echo '{"error":"no result.json"}' > result.json && git add result.json
          git commit -m "relay result" || true
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:${{ github.ref_name }}
