<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#020617" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f1f5f9" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-512x512.png" />
    <title>Thai RPG</title>
    <style>
      /* Prevent white flash before React mounts */
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
      }
      html.dark, html.dark body {
        background-color: #020617;
      }
      html:not(.dark), html:not(.dark) body {
        background-color: #f1f5f9;
      }
    </style>
    <script>
      // Detect system color scheme and set class before React mounts
      (function() {
        const mql = window.matchMedia('(prefers-color-scheme: dark)');
        function setTheme(e) {
          if (e.matches) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        }
        setTheme(mql);
        mql.addEventListener('change', setTheme);
      })();
    </script>
    <script>
      // Register service worker with cache-busting to force update on new deploys
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const swUrl = '/sw.js?v=' + new Date().toISOString().slice(0,10);
          navigator.serviceWorker.register(swUrl, { updateViaCache: 'none' })
            .then((registration) => {
              console.log('[PWA] Service Worker registered:', registration.scope);
              // Force check for updates on every page load
              registration.update();

              // Also check for updates when the app returns from background.
              // Mobile browsers may not check for SW updates on resume,
              // leaving the user stuck with an old (buggy) SW version.
              document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                  registration.update().catch(() => {});
                }
              });
            })
            .catch((error) => {
              console.error('[PWA] Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
